<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VMW Organisation</title>
<meta name="theme-color" content="#16233F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VMW Org">
<style>
:root{--bg:#0E1628;--panel:#16233F;--panel-2:#1D2D4F;--line:#2A3C63;--text:#EAF0FF;--muted:#9FB0D3;--gold:#D4A64A;--ok:#4CC38A;--ok-bg:rgba(76,195,138,.14);--bad:#F0665E;--bad-bg:rgba(240,102,94,.14);--warn:#F0B94B;--warn-bg:rgba(240,185,75,.14);--info-bg:rgba(90,140,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
h1,h2,h3{margin:0}
.sub{color:var(--muted);font-size:13px}
.hidden{display:none!important}
.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;padding:0}
.brand{font-weight:800;color:var(--gold)}
.banner{background:var(--info-bg);border-bottom:1px solid var(--line);padding:9px 16px;font-size:13.5px}
.banner .wrap{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:0}
.banner button{white-space:nowrap}
.btn{border:0;border-radius:10px;padding:11px 16px;font:600 14px system-ui;cursor:pointer;background:var(--panel-2);color:var(--text)}
.btn:disabled{opacity:.6}
.btn-gold{background:var(--gold);color:#1a1405}
.btn-line{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn-ok{background:var(--ok-bg);color:var(--ok)}
.btn-bad{background:var(--bad-bg);color:var(--bad)}
.btn-sm{padding:8px 12px;font-size:13px}
.btn-block{display:block;width:100%;text-align:center;text-decoration:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0}
.card .name{font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tag{display:inline-block;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:700;background:var(--panel-2);color:var(--muted)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.warn{background:var(--warn-bg);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin:10px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-size:19px}.stat span{font-size:12px;color:var(--muted)}
.field{margin:10px 0}.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font:15px system-ui}
.err{background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px;margin:10px 0;font-size:14px}
.ok-box{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:10px;margin:10px 0;font-size:14px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.nav button{flex:1;background:none;border:0;color:var(--muted);padding:11px 4px;font:600 12px system-ui}
.nav button.on{color:var(--gold)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.chip{white-space:nowrap;border:1px solid var(--line);border-radius:20px;padding:6px 12px;background:transparent;color:var(--muted);font:600 12.5px system-ui}
.chip.on{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.sec{margin:16px 0 4px;font-weight:700;font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:.04em}
.lead-body{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.pitch{background:var(--info-bg);border-radius:10px;padding:9px 11px;font-size:13px;margin:8px 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--bg);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));z-index:41}
.sheet .wrap{padding:0}
.x{float:right;background:none;border:0;color:var(--muted);font-size:22px}
.login{max-width:380px;margin:12vh auto 0;padding:0 16px}
.login .card{padding:18px}
.file{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.file input{width:auto}
.file .fn{flex:1;font-size:13.5px;word-break:break-all}
.viewer img{max-width:100%;border-radius:10px;margin-top:8px}
.viewer iframe{width:100%;height:60vh;border:0;border-radius:10px;margin-top:8px;background:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:14px}
.chk input{width:auto;margin-top:3px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#000c;color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90%}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="installBar" class="banner hidden"><div class="wrap"><span id="installText">Install this app on your phone for one-tap access.</span><span><button class="btn btn-gold btn-sm" id="installBtn">Install</button> <button class="btn btn-line btn-sm" id="installX">Later</button></span></div></div>
<div id="updateBar" class="banner hidden" style="background:var(--warn-bg)"><div class="wrap"><span>A new version is available.</span><button class="btn btn-gold btn-sm" id="updateBtn">Refresh</button></div></div>

<div id="loginView" class="login hidden">
  <h1 style="text-align:center;color:var(--gold);margin-bottom:4px">Vast My Wealth</h1>
  <div class="sub" style="text-align:center;margin-bottom:16px">Organisation login</div>
  <div class="card">
    <div class="field"><label for="lMobile">Mobile number</label><input id="lMobile" inputmode="numeric" maxlength="10" autocomplete="username"></div>
    <div class="field"><label for="lPin">PIN</label><input id="lPin" type="password" inputmode="numeric" autocomplete="current-password"></div>
    <div id="lErr" class="err hidden"></div>
    <button class="btn btn-gold btn-block" id="lBtn">Log in</button>
    <div class="sub" style="margin-top:10px">Your PIN was emailed to you when your seat was created. Forgot it? Ask the admin for a reset.</div>
  </div>
</div>

<div id="appView" class="hidden">
  <div class="top"><div class="wrap"><div><div class="brand" id="hdName">VMW</div><div class="sub" id="hdSub"></div></div><button class="btn btn-line btn-sm" id="refreshBtn">↻</button></div></div>
  <div class="wrap" id="main"></div>
  <div class="nav" id="nav"></div>
</div>

<div id="sheetRoot"></div>
<div id="toast" class="toast hidden"></div>

<script>
/* ===== settings: edit only API_URL if the worker address changes ===== */
var API_URL = "https://vmw-portal-api.vastmywealth.workers.dev/";

var SESS = null, ME = null, TAB = "", CACHE = {}, DEFERRED = null;
function $(id) { return document.getElementById(id); }
function esc(s) { var d = document.createElement("div"); d.textContent = (s === undefined || s === null) ? "" : s; return d.innerHTML; }
function escA(s) { return esc(s).replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
function inr(n) { var v = Number(n) || 0; return "₹" + v.toLocaleString("en-IN", { maximumFractionDigits: 2 }); }
function fmtAmt(a) { var n = Number(String(a).replace(/[^\d.]/g, "")); if (!n) return esc(a || ""); return n >= 10000000 ? "₹" + (n / 10000000).toFixed(2).replace(/\.?0+$/, "") + " Cr" : n >= 100000 ? "₹" + (n / 100000).toFixed(2).replace(/\.?0+$/, "") + " L" : "₹" + n.toLocaleString("en-IN"); }
function ago(ts) { if (!ts) return ""; var d = Math.floor((Date.now() - ts) / 86400000); return d <= 0 ? "today" : d === 1 ? "1 day ago" : d + " days ago"; }
function fmtDate(ts) { return ts ? new Date(ts).toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "2-digit" }) : ""; }
function toast(m, bad) { var t = $("toast"); t.textContent = m; t.style.background = bad ? "#8a2b25" : "#000c"; t.classList.remove("hidden"); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.add("hidden"); }, 3500); }
function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function busy(btn, label, fn) { var o = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + esc(label); return Promise.resolve().then(fn).finally(function () { btn.disabled = false; btn.innerHTML = o; }); }

function api(action, extra) {
  var p = { action: action };
  if (SESS) { p.mobile = SESS.mobile; p.token = SESS.token; }
  Object.keys(extra || {}).forEach(function (k) { p[k] = extra[k]; });
  return fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(p) })
    .then(function (r) { return r.text(); })
    .then(function (raw) {
      var j; try { j = JSON.parse(raw); } catch (e) { throw new Error("Server returned an unexpected reply. Try again."); }
      if (j && j.authExpired) { logout(true); throw new Error("Session expired. Please log in again."); }
      return j;
    });
}

/* ===== install + update banners ===== */
function standalone() { return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true; }
function installDismissed() { var t = Number(load("org_install_x") || 0); return t && Date.now() - t < 7 * 86400000; }
function showInstall(text, canClick) {
  if (standalone() || installDismissed()) return;
  $("installText").textContent = text; $("installBtn").classList.toggle("hidden", !canClick); $("installBar").classList.remove("hidden");
}
window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); DEFERRED = e; showInstall("Install this app on your phone for one-tap access.", true); });
window.addEventListener("appinstalled", function () { $("installBar").classList.add("hidden"); DEFERRED = null; });
$("installBtn").addEventListener("click", function () { if (!DEFERRED) return; DEFERRED.prompt(); DEFERRED.userChoice.finally(function () { DEFERRED = null; $("installBar").classList.add("hidden"); }); });
$("installX").addEventListener("click", function () { store("org_install_x", String(Date.now())); $("installBar").classList.add("hidden"); });
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone()) showInstall("To install: tap Share, then “Add to Home Screen”.", false);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      function ready(w) { w.addEventListener("statechange", function () { if (w.state === "installed" && navigator.serviceWorker.controller) { $("updateBar").classList.remove("hidden"); $("updateBtn").onclick = function () { w.postMessage("SKIP_WAITING"); }; } }); }
      if (reg.waiting && navigator.serviceWorker.controller) { $("updateBar").classList.remove("hidden"); $("updateBtn").onclick = function () { reg.waiting.postMessage("SKIP_WAITING"); }; }
      reg.addEventListener("updatefound", function () { if (reg.installing) ready(reg.installing); });
      setInterval(function () { reg.update().catch(function () {}); }, 30 * 60 * 1000);
    }).catch(function () { /* app still works without the service worker */ });
    var reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () { if (reloaded) return; reloaded = true; location.reload(); });
  });
}

/* ===== login ===== */
function showLogin() { $("appView").classList.add("hidden"); $("loginView").classList.remove("hidden"); var m = load("org_mobile"); if (m) $("lMobile").value = m; }
$("lBtn").addEventListener("click", function () {
  var mobile = $("lMobile").value.replace(/\D/g, "").slice(-10), pin = $("lPin").value.trim();
  $("lErr").classList.add("hidden");
  if (mobile.length !== 10 || !pin) { $("lErr").textContent = "Enter your mobile number and PIN."; $("lErr").classList.remove("hidden"); return; }
  busy($("lBtn"), "Logging in…", function () {
    return fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "orgLogin", mobile: mobile, pin: pin }) })
      .then(function (r) { return r.json(); }).then(function (j) {
        if (!j.success) { $("lErr").textContent = j.error || "Login failed."; $("lErr").classList.remove("hidden"); return; }
        SESS = { mobile: j.mobile, token: j.token, name: j.name, role: j.role, code: j.code };
        store("org_sess", JSON.stringify(SESS)); store("org_mobile", mobile); $("lPin").value = "";
        start();
      });
  }).catch(function (e) { $("lErr").textContent = e.message || "Network problem. Try again."; $("lErr").classList.remove("hidden"); });
});
$("lPin").addEventListener("keydown", function (e) { if (e.key === "Enter") $("lBtn").click(); });
function logout(silent) {
  if (SESS && !silent) { api("orgLogout").catch(function () {}); }
  SESS = null; ME = null; CACHE = {}; store("org_sess", null); showLogin();
}

/* ===== shell ===== */
var NAV_FULL = [["ov", "Overview"], ["leads", "Leads"], ["team", "Team"], ["earn", "Earnings"], ["me", "Me"]];
var NAV_SUPPORT = [["leads", "Leads"], ["me", "Me"]];
function start() {
  $("loginView").classList.add("hidden"); $("appView").classList.remove("hidden");
  api("orgMe").then(function (r) {
    if (!r.success) { toast(r.error || "Could not load", true); return; }
    ME = r;
    $("hdName").textContent = r.seat.name; $("hdSub").textContent = r.seat.role + (r.seat.territory ? " · " + r.seat.territory : "") + " · " + r.seat.code;
    var nav = r.seat.role === "Support" ? NAV_SUPPORT : NAV_FULL;
    $("nav").innerHTML = nav.map(function (n) { return '<button data-nav="' + n[0] + '">' + n[1] + "</button>"; }).join("");
    go(nav[0][0]);
  }).catch(function (e) { toast(e.message, true); });
}
$("nav").addEventListener("click", function (e) { var b = e.target.closest("[data-nav]"); if (b) go(b.getAttribute("data-nav")); });
$("refreshBtn").addEventListener("click", function () { CACHE = {}; go(TAB, true); });
function go(tab, force) {
  TAB = tab;
  document.querySelectorAll("#nav button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-nav") === tab); });
  window.scrollTo(0, 0);
  $("main").innerHTML = '<div class="sub" style="padding:20px 0">Loading…</div>';
  ({ ov: viewOverview, leads: viewLeads, team: viewTeam, earn: viewEarnings, me: viewMe })[tab](force);
}
function fail(e) { $("main").innerHTML = '<div class="err">' + esc(e.message || e) + "</div>"; }

/* ===== sheets ===== */
function openSheet(html) {
  $("sheetRoot").innerHTML = '<div class="sheet-bg" id="sbg"></div><div class="sheet"><div class="wrap"><button class="x" id="sx">✕</button>' + html + "</div></div>";
  $("sbg").onclick = closeSheet; $("sx").onclick = closeSheet;
}
function closeSheet() { $("sheetRoot").innerHTML = ""; }

/* ===== overview ===== */
function box(v, l) { return '<div class="stat"><b>' + v + "</b><span>" + l + "</span></div>"; }
function pct(a, b) { return b ? Math.round(a * 100 / b) + "%" : "—"; }
function viewOverview() {
  api("orgMis").then(function (r) {
    if (!r.success) return fail(r.error || "Could not load");
    var t = r.totals, h = "";
    h += '<div class="sub" style="margin-top:12px">Leads created in the last ' + r.months + " months, for you and everyone in your team. Updated " + new Date(r.generatedAt).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }) + ".</div>";
    h += '<div class="stats">' + box(t.leads, "Leads") + box(t.needsVerification + t.pending, "Waiting on documents") + box(t.sent, "Sent to DSA") + box(t.disbursed, "Disbursed") + box(inr(t.disbursedAmount), "Disbursed amount") + "</div>";
    h += '<div class="stats">' + box(pct(t.sent + t.disbursed, t.leads), "Reached DSA") + box(pct(t.disbursed, t.sent + t.disbursed), "Disbursed of sent") + box(t.stalePending, "Pending 3+ days") + box(t.hold, "On hold") + box(t.dsaRejected + t.rejected, "Rejected") + "</div>";
    if (r.earnings) h += '<div class="sec">Your earnings</div><div class="stats">' + box(inr(r.earnings.accrued), "Earned, not yet in a statement") + box(inr(r.earnings.inStatement), "In a statement, due") + box(inr(r.earnings.paid), "Paid") + "</div>";
    if ((r.children || []).length) h += '<div class="sec">By team</div>' + r.children.map(function (c) { return '<div class="card"><div class="name">' + esc(c.name || c.code) + ' <span class="sub">' + esc(c.code) + '</span></div><div class="sub">' + c.leads + " leads · " + c.pending + " waiting on documents · " + c.sent + " sent · " + c.disbursed + " disbursed (" + inr(c.amount) + ")</div></div>"; }).join("");
    var prods = Object.keys(r.byProduct || {});
    if (prods.length) h += '<div class="sec">By product</div><div class="card">' + prods.map(function (k) { var p = r.byProduct[k]; return '<div class="row"><span>' + esc(k) + '</span><span class="sub">' + p.leads + " leads · " + p.sent + " sent · " + p.disbursed + " disbursed (" + inr(p.amount) + ")</span></div>"; }).join("") + "</div>";
    if ((r.byMonth || []).length) h += '<div class="sec">By month</div><div class="card">' + r.byMonth.map(function (m) { return '<div class="row"><span>' + esc(m.month) + '</span><span class="sub">' + m.leads + " leads · " + m.disbursed + " disbursed (" + inr(m.amount) + ")</span></div>"; }).join("") + "</div>";
    if ((r.banks || []).length) h += '<div class="sec">Banks with disbursals</div><div class="card">' + r.banks.map(function (b) { return '<div class="row"><span>' + esc(b.bank) + '</span><span class="sub">' + b.n + " · " + inr(b.amount) + "</span></div>"; }).join("") + "</div>";
    if ((r.holdReasons || []).length) h += '<div class="sec">Why leads are on hold</div><div class="card">' + r.holdReasons.map(function (b) { return '<div class="row"><span>' + esc(b.reason) + '</span><span class="sub">' + b.n + "</span></div>"; }).join("") + "</div>";
    var fk = Object.keys(r.seatFill || {});
    if (fk.length) h += '<div class="sec">Seats in your team</div><div class="card">' + fk.map(function (k) { var f = r.seatFill[k]; return '<div class="row"><span>' + esc(k) + '</span><span class="sub">' + f.active + " active · " + f.vacant + " vacant</span></div>"; }).join("") + "</div>";
    $("main").innerHTML = h;
  }).catch(fail);
}

/* ===== leads ===== */
var LEADS = [], LFILTER = "all", LQUERY = "", OPEN = {};
var FILTERS = [["all", "All"], ["docs", "Waiting on documents"], ["sent", "Sent to DSA"], ["proc", "In process"], ["dis", "Disbursed"], ["hold", "Hold / Rejected"], ["mine", "My customers"]];
function leadMatch(l) {
  var f = LFILTER;
  if (f === "docs" && !(l.state === "Pending Documents" || l.state === "Needs Verification")) return false;
  if (f === "sent" && l.state !== "Sent to DSA") return false;
  if (f === "proc" && !(l.dsaCategory === "Processing" || l.dsaCategory === "Follow-up")) return false;
  if (f === "dis" && l.dsaCategory !== "Disbursed") return false;
  if (f === "hold" && !(l.state === "Hold" || l.state === "Rejected" || l.dsaCategory === "Rejected")) return false;
  if (f === "mine" && !l.mine) return false;
  if (LQUERY) { var q = LQUERY.toLowerCase(); if ((l.name + " " + l.mobile + " " + l.leadId + " " + l.ownerName).toLowerCase().indexOf(q) === -1) return false; }
  return true;
}
function stageTag(l) {
  if (l.dsaCategory === "Disbursed") return '<span class="tag ok">Disbursed</span>';
  if (l.dsaCategory === "Rejected") return '<span class="tag bad">DSA rejected</span>';
  if (l.dsaCategory === "Processing") return '<span class="tag ok">In process' + (l.dsaBank ? " · " + esc(l.dsaBank) : "") + "</span>";
  if (l.dsaCategory === "Follow-up") return '<span class="tag warn">Follow-up</span>';
  var m = { "Needs Verification": ["warn", "Verify documents"], "Pending Documents": ["warn", "Documents pending"], "Ready": ["ok", "Ready"], "Sent to DSA": ["ok", "Sent to DSA"], "Hold": ["bad", "Hold"], "Rejected": ["bad", "Rejected"], "Legacy": ["", "Older lead"] }[l.state];
  return m ? '<span class="tag ' + m[0] + '">' + m[1] + "</span>" : '<span class="tag">' + esc(l.state || "New") + "</span>";
}
function viewLeads(force) {
  var done = function (r) {
    LEADS = r.leads || [];
    var support = ME.seat.role === "Support";
    $("main").innerHTML = '<div class="sub" style="margin-top:12px">Showing leads created in the last ' + r.months + " months" + (r.truncated ? " (newest 1500)" : "") + ".</div>" +
      '<div class="field"><input id="lq" placeholder="Search name, mobile or lead ID" value="' + escA(LQUERY) + '"></div>' +
      (support ? "" : '<div class="chips" id="lchips">' + FILTERS.map(function (f) { return '<button class="chip' + (LFILTER === f[0] ? " on" : "") + '" data-f="' + f[0] + '">' + f[1] + "</button>"; }).join("") + "</div>") +
      '<div id="llist"></div>';
    $("lq").addEventListener("input", function () { LQUERY = this.value.trim(); renderLeads(); });
    if ($("lchips")) $("lchips").addEventListener("click", function (e) { var b = e.target.closest("[data-f]"); if (!b) return; LFILTER = b.getAttribute("data-f"); document.querySelectorAll("#lchips .chip").forEach(function (c) { c.classList.toggle("on", c === b); }); renderLeads(); });
    renderLeads();
  };
  if (CACHE.leads && !force) return done(CACHE.leads);

  h += '<button class="btn btn-bad btn-block" style="margin-top:16px" id="outBtn">Log out</button>';

  if ($("cpLink")) { $("cpLink").onclick = function () { (navigator.clipboard ? navigator.clipboard.writeText(ME.referralLink) : Promise.reject()).then(function () { toast("Copied"); }).catch(function () { toast("Copy not available", true); }); }; $("shLink").onclick = function () { if (navigator.share) navigator.share({ title: "Vast My Wealth", text: "Apply for a loan with Vast My Wealth", url: ME.referralLink }).catch(function () {}); else toast("Sharing is not available here; use Copy", true); }; }
  $("cpSave").onclick = function () { busy($("cpSave"), "Saving…", function () { return api("orgChangePin", { currentPin: $("cpOld").value.trim(), newPin: $("cpNew").value.trim() }).then(function (r) { if (!r.success) return toast(r.error || "Failed", true); toast("PIN changed"); $("cpOld").value = ""; $("cpNew").value = ""; }); }).catch(function (e) { toast(e.message, true); }); };
  $("outBtn").onclick = function () { logout(false); };
}

/* ===== boot ===== */
(function () {
  var raw = load("org_sess");
  if (raw) { try { SESS = JSON.parse(raw); } catch (e) { SESS = null; } }
  if (SESS && SESS.token) start(); else showLogin();
})();
</script>
</body>
